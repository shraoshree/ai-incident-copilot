services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: incident
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.8-flash
      DATABASE_URL: postgresql://incident:${POSTGRES_PASSWORD}@db:5432/incident
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
