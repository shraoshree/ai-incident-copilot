name: Live Gemini agent verification

on:
  push:
    branches: [feature/agentic-incident-investigation]
    paths:
      - '.github/workflows/live-agent.yml'
      - 'test_live_agent.py'
      - 'agent_tools.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify live function calling
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python -m pytest -q -m live test_live_agent.py
