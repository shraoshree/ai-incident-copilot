name: Python tests

on:
  push:
    branches: [feature/agentic-incident-investigation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q -m 'not live and not pgvector'

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: incident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incident"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://incident:integration_only@localhost:5432/incident
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test real pgvector queries
        run: python -m pytest -q -m pgvector test_pgvector_integration.py
