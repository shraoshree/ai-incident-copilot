name: Python tests

on:
  push:
    branches: [feature/agentic-incident-investigation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q -m 'not live and not pgvector'
      - name: Evaluate labeled retrieval cases
        run: python evals/evaluate.py --backend keyword --split test --output evals/results.json

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: incident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incident"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://incident:integration_only@localhost:5432/incident
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test real pgvector queries
        run: python -m pytest -q -m pgvector test_pgvector_integration.py

  semantic-benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: incident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incident"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://incident:integration_only@localhost:5432/incident
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Index current incident corpus
        run: python scripts/index_knowledge.py
      - name: Preserve embedding cache
        uses: actions/cache/save@v4
        with:
          path: .cache/embeddings
          key: incident-embeddings-${{ github.sha }}
      - name: Calibrate cutoff on dev only
        run: |
          python evals/evaluate.py --backend semantic --split dev --tune-threshold > evals/calibration.json
          cat evals/calibration.json
          echo "MIN_SIMILARITY=$(python -c 'import json; print(json.load(open("evals/calibration.json"))["recommended_min_similarity"])')" >> "$GITHUB_ENV"
      - name: Compare on test split
        run: python evals/evaluate.py --backend both --split test --output evals/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-evaluation
          path: |
            evals/results.json
            evals/calibration.json
