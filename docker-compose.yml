services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: development_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d incidents"]
      interval: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://copilot:development_only@db:5432/incidents
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
